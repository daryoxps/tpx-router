name: Compila APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Estrai progetto
        run: unzip -o tpx-project.zip

      - name: Applica correzioni (cartella override)
        run: if [ -d override ]; then cp -rv override/. . ; fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compila
        run: gradle --no-daemon assembleRelease

      - name: Rinomina APK
        run: cp app/build/outputs/apk/release/app-release.apk TPX-Router.apk

      - uses: actions/upload-artifact@v4
        with:
          name: TPX-Router
          path: TPX-Router.apk

      - name: Pubblica release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: TPX Router 1.0.${{ github.run_number }}
          files: TPX-Router.apk
          make_latest: true
